name: Build and Release

on:
  push:
    branches: 'main'
    paths-ignore:
      - '**.md'
      - '**/**md'
      - 'LICENSE'
      - '.**'
  pull_request:
    branches:
      - 'main'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.0.0)'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prep:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.calc.outputs.tag }}
      title: ${{ steps.calc.outputs.title }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build tag and title
        id: calc
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="dev"
          fi
          DATE_TAG=$(date +%d%m%y)
          DATE_TITLE=$(date +%d-%m-%y)
          echo "tag=ballTinyWorld-$VERSION-$DATE_TAG" >> "$GITHUB_OUTPUT"
          echo "title=ballTinyWorld v$VERSION - $DATE_TITLE" >> "$GITHUB_OUTPUT"

  build-linux:
    needs: prep
    if: always() && (needs.prep.result == 'success' || needs.prep.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git cmake zip \
            libasound2-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev \
            libxinerama-dev libwayland-dev libxkbcommon-dev

      - name: Cache raylib
        id: cache-raylib
        uses: actions/cache@v6
        with:
          path: ~/raylib-install
          key: raylib-6.0-linux-x86_64-v6
          restore-keys: |
            raylib-6.0-linux-x86_64-
            raylib-6.0-linux-

      - name: Build raylib from source
        if: steps.cache-raylib.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch 6.0 https://github.com/raysan5/raylib.git
          cd raylib
          mkdir build && cd build
          cmake -DBUILD_SHARED_LIBS=OFF -DPLATFORM=Desktop \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=$HOME/raylib-install ..
          make -j$(nproc)
          make install

      - name: Install raylib
        run: |
          sudo cp -r $HOME/raylib-install/* /usr/local/
          sudo ldconfig

      - name: Build game
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)
          cp build/game ballTinyWorld-linux
          echo "=== build done ==="
          ls -la ballTinyWorld-linux
          file ballTinyWorld-linux

      - name: Verify raylib is static
        run: |
          if ldd ballTinyWorld-linux | grep -qi raylib; then
            echo "raylib still dynamic!"
            ldd ballTinyWorld-linux | grep raylib
            exit 1
          fi
          echo "raylib is static"

      - name: Package
        run: |
          chmod +x ballTinyWorld-linux run.sh
          tar -czf ballTinyWorld-linux.tar.gz ballTinyWorld-linux src/assets/ run.sh
          ls -la ballTinyWorld-linux.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: ballTinyWorld-linux
          path: ballTinyWorld-linux.tar.gz

  build-macos:
    needs: prep
    if: always() && (needs.prep.result == 'success' || needs.prep.result == 'skipped')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install cmake
        run: brew install cmake

      - name: Cache raylib universal
        id: cache-raylib
        uses: actions/cache@v6
        with:
          path: ~/raylib-install
          key: raylib-6.0-macos-universal-v6
          restore-keys: |
            raylib-6.0-macos-universal-
            raylib-6.0-macos-

      - name: Build raylib universal
        if: steps.cache-raylib.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch 6.0 https://github.com/raysan5/raylib.git
          cd raylib

          mkdir -p build-arm64 && cd build-arm64
          cmake -DBUILD_SHARED_LIBS=OFF -DPLATFORM=Desktop \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64" \
            -DCMAKE_INSTALL_PREFIX=$HOME/raylib-arm64 ..
          make -j$(sysctl -n hw.ncpu)
          make install
          cd ..

          mkdir -p build-x86_64 && cd build-x86_64
          cmake -DBUILD_SHARED_LIBS=OFF -DPLATFORM=Desktop \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="x86_64" \
            -DCMAKE_INSTALL_PREFIX=$HOME/raylib-x86_64 ..
          make -j$(sysctl -n hw.ncpu)
          make install
          cd ..

          mkdir -p $HOME/raylib-install/lib $HOME/raylib-install/include
          lipo -create \
            $HOME/raylib-arm64/lib/libraylib.a \
            $HOME/raylib-x86_64/lib/libraylib.a \
            -output $HOME/raylib-install/lib/libraylib.a
          cp -r $HOME/raylib-arm64/include/* $HOME/raylib-install/include/
          cp -r $HOME/raylib-arm64/lib/cmake $HOME/raylib-install/lib/ 2>/dev/null || true

          rm -rf $HOME/raylib-arm64 $HOME/raylib-x86_64

          echo "=== Universal raylib info ==="
          lipo -info $HOME/raylib-install/lib/libraylib.a
          ls -la $HOME/raylib-install/lib/

      - name: Install raylib
        run: |
          sudo cp -r $HOME/raylib-install/* /usr/local/
          echo "=== Installed raylib ==="
          lipo -info /usr/local/lib/libraylib.a
          ls -la /usr/local/lib/libraylib.a
          ls /usr/local/lib/cmake/raylib/ 2>/dev/null || echo "No cmake config found"

      - name: Build game (universal)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" \
            -Draylib_DIR=/usr/local/lib/cmake/raylib
          cmake --build build -j$(sysctl -n hw.ncpu)
          cp build/game ballTinyWorld-macos
          echo "=== build done ==="
          file ballTinyWorld-macos
          lipo -info ballTinyWorld-macos

      - name: Verify raylib is static
        run: |
          if otool -L ballTinyWorld-macos | grep -qi raylib; then
            echo "raylib still dynamic!"
            otool -L ballTinyWorld-macos | grep raylib
            exit 1
          fi
          echo "raylib is static"

      - name: Verify universal binary
        run: |
          ARCHS=$(lipo -archs ballTinyWorld-macos)
          echo "Architectures: $ARCHS"
          if ! echo "$ARCHS" | grep -q "x86_64"; then
            echo "Missing x86_64!"
            exit 1
          fi
          if ! echo "$ARCHS" | grep -q "arm64"; then
            echo "Missing arm64!"
            exit 1
          fi
          echo "Universal binary OK"

      - name: Package
        run: |
          zip -r ballTinyWorld-macos.zip ballTinyWorld-macos src/assets/ run-macos.sh
          ls -la ballTinyWorld-macos.zip

      - uses: actions/upload-artifact@v7
        with:
          name: ballTinyWorld-macos
          path: ballTinyWorld-macos.zip

  build-windows:
    needs: prep
    if: always() && (needs.prep.result == 'success' || needs.prep.result == 'skipped')
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7

      - name: Setup MSYS2 (CLANG64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-make
            mingw-w64-clang-x86_64-ninja
            git
            zip

      - name: Cache raylib
        id: cache-raylib
        uses: actions/cache@v6
        with:
          path: C:\raylib-install
          key: raylib-6.0-windows-clang64-v6
          restore-keys: |
            raylib-6.0-windows-clang64-
            raylib-6.0-windows-

      - name: Build raylib from source
        if: steps.cache-raylib.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch 6.0 https://github.com/raysan5/raylib.git
          cd raylib
          mkdir build && cd build
          cmake -G Ninja \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DBUILD_SHARED_LIBS=OFF \
            -DPLATFORM=Desktop \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/c/raylib-install ..
          ninja
          ninja install
          echo "=== installed ==="
          ls -la /c/raylib-install/lib/
          ls -la /c/raylib-install/include/

      - name: Verify raylib installed
        run: |
          ls -la /c/raylib-install/lib/libraylib.a
          ls -la /c/raylib-install/include/raylib.h

      - name: Build game
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=/c/raylib-install
          cmake --build build
          cp build/game.exe ballTinyWorld-windows.exe
          echo "=== build done ==="
          ls -la ballTinyWorld-windows.exe
          file ballTinyWorld-windows.exe

      - name: Verify raylib is static
        run: |
          if objdump -p ballTinyWorld-windows.exe | grep -qi raylib; then
            echo "raylib still dynamic!"
            exit 1
          fi
          echo "raylib is static"

      - name: Check DLL dependencies
        run: |
          DEPS=$(objdump -p ballTinyWorld-windows.exe | grep "DLL Name:" | awk '{print $3}')
          echo "$DEPS"
          for bad in libc++.dll libunwind.dll libwinpthread-1.dll libgcc_s_seh-1.dll libstdc++-6.dll; do
            if echo "$DEPS" | grep -qi "$bad"; then
              echo "ERROR: depends on $bad"
              exit 1
            fi
          done
          echo "No MinGW/Clang runtime DLLs needed"

      - name: Package
        run: |
          zip -r ballTinyWorld-windows.zip ballTinyWorld-windows.exe src/assets/
          ls -la ballTinyWorld-windows.zip

      - uses: actions/upload-artifact@v7
        with:
          name: ballTinyWorld-windows
          path: ballTinyWorld-windows.zip

  release:
    needs: [prep, build-linux, build-macos, build-windows]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download Linux build
        uses: actions/download-artifact@v8
        with:
          name: ballTinyWorld-linux

      - name: Download macOS build
        uses: actions/download-artifact@v8
        with:
          name: ballTinyWorld-macos

      - name: Download Windows build
        uses: actions/download-artifact@v8
        with:
          name: ballTinyWorld-windows

      - name: Create tag
        run: |
          git tag "${{ needs.prep.outputs.tag }}"
          git push origin "${{ needs.prep.outputs.tag }}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prep.outputs.tag }}
          name: ${{ needs.prep.outputs.title }}
          files: |
            ballTinyWorld-linux.tar.gz
            ballTinyWorld-macos.zip
            ballTinyWorld-windows.zip
          generate_release_notes: true

      - name: Upload to itch.io (Linux)
        uses: yeslayla/butler-publish-itchio-action@master
        env:
          BUTLER_CREDENTIALS: ${{ secrets.ITCH_API }}
          CHANNEL: linux
          ITCH_GAME: ball-tiny-world
          ITCH_USER: dryfish09
          PACKAGE: ballTinyWorld-linux.tar.gz

      - name: Upload to itch.io (macOS)
        uses: yeslayla/butler-publish-itchio-action@master
        env:
          BUTLER_CREDENTIALS: ${{ secrets.ITCH_API }}
          CHANNEL: macos
          ITCH_GAME: ball-tiny-world
          ITCH_USER: dryfish09
          PACKAGE: ballTinyWorld-macos.zip

      - name: Upload to itch.io (Windows)
        uses: yeslayla/butler-publish-itchio-action@master
        env:
          BUTLER_CREDENTIALS: ${{ secrets.ITCH_API }}
          CHANNEL: windows
          ITCH_GAME: ball-tiny-world
          ITCH_USER: dryfish09
          PACKAGE: ballTinyWorld-windows.zip
